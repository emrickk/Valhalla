name: Clean Phone checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q clean_phone.py tools tests
      - run: python clean_phone.py --about
      - run: python -m pip install capstone==5.0.9 pyasn1==0.6.5
      - run: python val-protocol/lk_auto_patch.py --help
      - run: python val-protocol/tools/verify_mtk_image.py --help
      - if: runner.os == 'macOS'
        run: xcrun swiftc tools/razr2024/macos/LoginHelper.swift -o /tmp/razr-login-helper
